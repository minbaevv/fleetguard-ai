[tool.ruff]
line-length = 100
target-version = "py312"
src = ["training", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
# Проект русскоязычный: RUF001-003 находят «похожие» кириллические буквы в каждом комментарии.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["training"]
testpaths = ["tests"]
addopts = "-q"
